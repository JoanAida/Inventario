<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><h1>Inventario</h1><button id="gear">⚙️</button></header><input id="search" placeholder="Buscar producto..."><div id="chips"></div><div id="grid"></div><button id="fab">＋</button></div>
<dialog id="sheet"><form method="dialog"><h2>Nuevo producto</h2><label>Nombre<input id="name"></label><label>Precio (€)<input id="price" type="number" step="0.01"></label><label>Categoría<select id="cat"></select></label><label>Notas<textarea id="notes"></textarea></label><label>Foto<input id="photo" type="file" accept="image/*"></label><div class="actions"><button>Cancelar</button><button id="save">Guardar</button></div></form></dialog>
<dialog id="settings"><h2>Ajustes</h2><p>Apariencia</p><div class="seg"><button data-theme="dark">🌙</button><button data-theme="light">☀️</button><button data-theme="auto">📱</button></div><button id="closeSet">Cerrar</button></dialog>
<script src="app.js"></script></body></html>
