<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
</head><body><div class="app"><header><h1>📦 Inventario</h1><input id="search" placeholder="Buscar producto..."></header>

<h3>Fotos</h3><div id="gallery" class="gallery"></div><button id="addPhoto" class="btn">+ Añadir foto</button><button id="save" class="btn green">Guardar</button></div></div>
